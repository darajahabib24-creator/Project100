[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent"
version = "1.0"
description = "Local autonomous agent runtime: tool loop, memory, planner. No cloud API."
requires-python = ">=3.10"

[project.scripts]
agent = "agent.cli:main"

[project.optional-dependencies]
rdp-vnc = ["Pillow>=9", "cryptography>=41"]

[tool.setuptools]
packages = ["agent"]
