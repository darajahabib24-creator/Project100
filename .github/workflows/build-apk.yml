name: Interactive Ubuntu Console

on:
  workflow_dispatch: # Allows you to manually trigger this from the GitHub Actions tab

# Grants your SSH session permission to push changes back to the repository
 permissions:
    contents: write
    workflows: write 

jobs:
  interactive-session:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install Hermes & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev python3-dev cargo rustc
          curl -fsSL https://githubusercontent.com | bash
          # Automatically restore saved Hermes configs if they exist in the repo
          if [ -d "./hermes-backup" ]; then
            mkdir -p ~/.hermes
            cp -r ./hermes-backup/* ~/.hermes/
          fi

      - name: Launch Interactive SSH Terminal
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: false
          
